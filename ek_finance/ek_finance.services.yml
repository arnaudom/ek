services:
  ek_finance.journal:
    class: Drupal\ek_finance\Service\JournalService
    shared: false   # new instance on every ::service() call ($tax, $debit, $credit reset at each call)
    # No arguments needed since the constructor takes none

  ek_finance.journal_template:
    class: Drupal\ek_finance\Service\JournalTemplateService
    arguments: ['@current_user']

  ek_finance.account:
    class: Drupal\ek_finance\Service\AidList
    # No arguments needed since the constructor takes none