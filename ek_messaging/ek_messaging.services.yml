services:

  # Encryption / decryption service.
  ek_messaging.encryption:
    class: Drupal\ek_messaging\Service\MessageEncryptionService
    arguments:
      - '@logger.factory'

  # Message registration service (replaces procedural ek_message_register()).
  ek_messaging.message_registration:
    class: Drupal\ek_messaging\Service\MessageRegistrationService
    arguments:
      - '@database'
      - '@ek_messaging.encryption'
      - '@ek_admin.webhook'

  # Messaging API service for inbox/read/send operations.
  ek_messaging.messaging_api:
    class: Drupal\ek_messaging\Service\MessagingApiService
    arguments:
      - '@logger.factory'
      - '@ek_messaging.message_registration'
      - '@ek_messaging.encryption'
      - '@plugin.manager.mail'