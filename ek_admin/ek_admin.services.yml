services:
  ek_admin.theme.negotiator:
    class: Drupal\ek_admin\Theme\ThemeNegotiator
    tags:
      - { name: theme_negotiator, priority: 50 }
      
  ek_admin_event_user:
    class: Drupal\ek_admin\EventSubscriber\NewUserSubscriber
    tags:
      - {name: event_subscriber }
      
  ek_admin.database.external_db:
    class: Drupal\Core\Database\Connection
    factory: Drupal\Core\Database\Database::getConnection
    arguments: [external_db,external_db]
  
  ek_admin.database.external_db.entity.query.sql:
    class: Drupal\Core\Entity\Query\Sql\QueryFactory
    arguments: ['@ek_admin.database.external_db']
    tags:
      - { name: backend_overridable }
      
  ek_admin.twig_extension:
    class: Drupal\ek_admin\TwigExtension\TwigExtension
    tags:
      - { name: twig.extension }

  ek_admin.service:
    class: Drupal\ek_admin\Service\AdminService
    arguments: ['@config.factory', '@logger.factory']
  
  ek_admin.task_notification:
    class: Drupal\ek_admin\Service\TaskNotificationService
    arguments: ['@logger.factory', '@module_handler']

  ek_admin.task_api:
    class: Drupal\ek_admin\Service\TaskApiService
    arguments: ['@logger.factory']

  ek_admin.webhook:
    class: Drupal\ek_admin\Service\WebhookService
    arguments: ['@queue', '@http_client', '@logger.factory']
